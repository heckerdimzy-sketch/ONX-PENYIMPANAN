<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dimzy • Database Penyimpan</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- BACKGROUND VIDEO -->
    <video id="bg-video" autoplay muted loop playsinline>
        <source src="https://files.catbox.moe/7ebuxr.mp4" />
        <!-- Ganti URL video di atas sesuai keinginanmu -->
    </video>

    <div id="app">
        <!-- HALAMAN LOGIN / REGISTER -->
        <div id="auth-page" class="page active">
            <div class="card">
                <h1 class="logo">Database<span>ONX</span></h1>
                <p class="tagline">Website untuk menyimpan file</p>
                <div id="login-box">
                    <input type="text" id="login-username" placeholder="Username" />
                    <input type="password" id="login-password" placeholder="Password" />
                    <button id="login-btn">Masuk</button>
                </div>
                <div id="register-box" style="display:none;">
                    <input type="text" id="reg-username" placeholder="Username baru" />
                    <input type="password" id="reg-password" placeholder="Password" />
                    <input type="password" id="reg-confirm" placeholder="Konfirmasi Password" />
                    <button id="register-btn">Daftar</button>
                </div>
                <p id="toggle-auth" class="switch">Belum punya akun? Daftar </p>
                <p id="auth-message" class="msg"></p>
            </div>
        </div>

        <!-- HALAMAN GALERI -->
        <div id="gallery-page" class="page">
            <div class="card full">
                <div class="topbar">
                    <h2>📁 Arsip <span id="display-username"></span></h2>
                    <button id="logout-btn" class="outline">Keluar</button>
                </div>

                <!-- TEKS SELAMAT DATANG -->
                <div class="welcome-text">
                    <h3>😈 Selamat datang,Tuan😈 <span id="display-username"></span>!</h3>
                    <p>Simpan Data datamu @by: dimzy</p>
                </div>

                <div class="upload">
                    <input type="file" id="file-input" multiple accept="image/*,video/*,.mp4,.webm,.ogg,.mov,.avi,.mkv" />
                    <label for="file-input" class="upload-btn">+ Tambah Media</label>
                </div>
                <div id="gallery-grid" class="grid"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
